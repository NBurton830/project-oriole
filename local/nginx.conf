# One origin for Element + the client API, so a single tunnel URL serves both.
# /_synapse/admin is deliberately NOT proxied: account creation stays local-only.
server {
  listen 80;
  client_max_body_size 50M;

  location /_matrix/ {
    proxy_pass http://homeserver:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  location /_synapse/client/ {
    proxy_pass http://homeserver:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Element config is rewritten with the current tunnel URL on every start.
  location = /config.json {
    alias /element-config/config.json;
    add_header Cache-Control "no-store";
  }

  location / {
    proxy_pass http://element:80;
  }
}
